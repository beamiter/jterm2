[package]
name = "ember"
version = "0.4.0"
edition = "2021"
description = "A GPU-accelerated terminal emulator built with Rust and egui"
repository = "https://github.com/beamiter/ember"
readme = "README.md"
license = "MIT OR Apache-2.0"
keywords = ["terminal", "terminal-emulator", "egui", "wgpu"]
categories = ["command-line-utilities", "gui"]

[dependencies]
libc = "0.2"
# Pin the shared contract so a branch move cannot silently change a release build.
jterm_core = { version = "0.2.0", git = "https://github.com/beamiter/jterm_core.git", rev = "1ef0212d0e80a269c9b9a30ba2b179d6f570bb92" }
log = "0.4"
env_logger = "0.11"
crossbeam-channel = "0.5"
parking_lot = "0.12"
anyhow = "1.0"
egui = "0.36.1"
eframe = { version = "0.36.1", default-features = false, features = ["accesskit", "default_fonts", "wgpu", "glow", "wayland", "x11"] }
egui-wgpu = "0.36.1"
# Keep this aligned with egui-wgpu/eframe 0.36. A second wgpu major version
# makes callback trait types incompatible even when their names are identical.
wgpu = "=30.0.1"
bytemuck = { version = "1", features = ["derive"] }
ab_glyph = "0.2"
fontdue = "0.9.4"
unicode-width = "0.2"
unicode-normalization = "0.1"
serde = { version = "1.0", features = ["derive"] }
uuid = { version = "1.24", features = ["v4", "serde"] }
regex = "1.13"
serde_json = { version = "1.0", features = ["raw_value"] }
fuzzy-matcher = "0.3"
base64 = "0.23"
image = { version = "0.25", default-features = false, features = ["png"] }
toml = "1.1.3"
# serde_yaml_ng is gone from this manifest: the workflow loader that parsed
# YAML moved to jterm_core, which depends on the same parser, and no other
# ember surface reads YAML.
dirs = "7.0.0"
lru = "0.18"
smallvec = "1.15"
once_cell = "1.21"

# HarfRust is the maintained RustyBuzz successor. It is already shared with
# egui's font stack, and uses read-fonts instead of adding another parser.
harfrust = "0.13.3"

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }

[[bench]]
name = "terminal_benchmark"
harness = false

# 编译优化配置
[profile.dev]
# 增量编译加速重编译
incremental = true

# 为依赖项启用小优化，平衡编译时间和运行性能
[profile.dev.package."*"]
opt-level = 1

[profile.release]
lto = "thin"
strip = "symbols"
codegen-units = 1
opt-level = 3
